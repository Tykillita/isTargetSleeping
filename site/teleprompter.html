<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teleprompter · isTargetSleeping</title>
  <link rel="stylesheet" href="site.css">
  <style>
    body {
      background: #0C0C0E;
      color: #f2f2f4;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .tp-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .tp-title {
      font-size: 18px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tp-controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .tp-control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #a1a1a6;
    }

    .tp-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    .tp-btn:hover { background: rgba(255, 255, 255, 0.15); }
    .tp-btn.primary { background: #33e07a; color: #000; border: none; font-weight: 600; }
    .tp-btn.primary:hover { background: #2bc968; }

    .tp-main {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .tp-editor {
      width: 300px;
      background: rgba(0, 0, 0, 0.2);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s, width 0.3s;
    }

    .tp-editor.hidden {
      width: 0;
      transform: translateX(-300px);
    }

    .tp-editor.hidden * {
      display: none;
    }

    .tp-editor-header {
      padding: 12px;
      font-size: 13px;
      color: #a1a1a6;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tp-textarea {
      flex: 1;
      background: transparent;
      color: #fff;
      border: none;
      padding: 16px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
    }

    .tp-viewer {
      flex: 1;
      overflow-y: auto;
      padding: 40px 20px;
      scrollbar-width: none;
      position: relative;
    }

    .tp-viewer::-webkit-scrollbar { display: none; }

    .tp-text {
      max-width: 800px;
      margin: 0 auto;
      font-size: 48px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      color: #fff;
      white-space: pre-wrap;
    }

    .tp-progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: #33e07a;
      width: 0%;
      transition: width 0.1s linear;
      z-index: 5;
    }

    .tp-toggle-edit {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 30px;
      height: 60px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: none;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      transition: background 0.2s;
    }

    .tp-toggle-edit:hover { background: rgba(255, 255, 255, 0.1); }

    input[type="range"] {
      cursor: pointer;
      accent-color: #33e07a;
    }
  </style>
</head>
<body>
  <header class="tp-header">
    <div class="tp-title">
      <img src="media/istargetsleeping-icon.svg" alt="" width="24" height="24">
      Teleprompter
    </div>
    <div class="tp-controls">
      <div class="tp-control-group">
        <label for="speed">Velocidad</label>
        <input type="range" id="speed" min="5" max="150" value="25">
        <span id="speed-val">25</span>
      </div>
      <button class="tp-btn" id="btn-reset">Reiniciar</button>
      <button class="tp-btn primary" id="btn-play">Reproducir</button>
    </div>
  </header>

  <main class="tp-main">
    <div class="tp-toggle-edit" id="toggle-edit" title="Editar texto">⚙️</div>

    <div class="tp-editor" id="editor">
      <div class="tp-editor-header">Guion</div>
      <textarea class="tp-textarea" id="script-input" placeholder="Escribe o pega tu texto aquí..."></textarea>
    </div>

    <div class="tp-viewer" id="viewer">
      <div class="tp-text" id="display-text">El texto aparecerá aquí...</div>
      <div class="tp-progress-bar" id="progress"></div>
    </div>
  </main>

  <script src="teleprompter.js"></script>
</body>
</html>
