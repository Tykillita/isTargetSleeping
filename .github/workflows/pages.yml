name: pages

# Publica site\ en GitHub Pages. Requiere Settings › Pages › Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['site/**', 'Assets/**', 'docs/images/**', 'docs/video/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        shell: pwsh
        run: .\site\build.ps1 -Out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
