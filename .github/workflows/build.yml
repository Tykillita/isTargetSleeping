name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tests
        run: .\build.ps1 -Test
        shell: pwsh
      - name: Build x64 and arm64
        run: .\package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: isTargetSleeping-windows
          path: dist/*
