const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function appear(el, t, at, dur = 0.6, dy = 30, extra = '') {
  const k = eOut(seg(t, at, at + dur));
  el.style.opacity = k;
  el.style.transform = `translateY(${(1 - k) * dy}px) ${extra}`;
  el.style.filter = k < 1 ? `blur(${(1 - k) * 8}px)` : '';
}

// ---------- sprites ----------
let META;
function spriteEl(pet, scale) {
  const d = document.createElement('div');
  d.className = 'sprite';
  d._pet = pet; d._scale = scale;
  const m = META[pet];
  d.style.width = m.w * scale + 'px'; d.style.height = m.h * scale + 'px';
  return d;
}
function setSprite(d, row, frame, loop = true) {
  const m = META[d._pet], n = m.rows[row];
  const usable = loop && n > 12 ? n - 1 : n;
  const f = loop ? ((frame % usable) + usable) % usable : clamp(frame, 0, n - 1);
  const s = d._scale;
  if (d._row !== row) {
    d.style.backgroundImage = `url(sprites/${d._pet}-${row}.png)`;
    d.style.backgroundSize = `${m.w * n * s}px ${m.h * s}px`;
    d._row = row;
  }
  d.style.backgroundPosition = `${-Math.floor(f) * m.w * s}px 0px`;
}

// ---------- render ----------
function render(t) {
  // scene visibility with crossfade
  for (const [id, a, b] of SCENES) {
    const el = $(id);
    const k = Math.min(seg(t, a, a + 0.5), 1 - seg(t, b - 0.5, b));
    el.style.opacity = k;
    el.style.display = k <= 0 ? 'none' : '';
    el.style.transform = `scale(${lerp(1.03, 1, eOut(seg(t, a, a + 0.8))) * lerp(1, 0.985, seg(t, b - 0.5, b))})`;
  }
  $('bgglow').style.setProperty('--gx', `${30 + Math.sin(t * 0.21) * 18}%`);
  $('bgglow').style.setProperty('--gy', `${42 + Math.cos(t * 0.17) * 14}%`);

  // 1 · Intro
  if (t < 6.5) {
    const ring = eInOut(seg(t, 0.2, 1.4));
    $('l1ring').style.strokeDashoffset = 1 - ring;
    document.querySelectorAll('#logo1 .tick').forEach((el, i) => {
      const k = eBack(seg(t, 0.9 + i * 0.12, 1.5 + i * 0.12));
      const dir = [[0, -1], [1, 0], [0, 1], [-1, 0]][i];
      el.style.transform = `translate(${dir[0] * (1 - k) * 160}px, ${dir[1] * (1 - k) * 160}px)`;
      el.style.opacity = seg(t, 0.9 + i * 0.12, 1.1 + i * 0.12);
    });
    $('l1eye').style.strokeDashoffset = 1 - eOut(seg(t, 1.6, 2.2));
    const lash = eBack(seg(t, 2.1, 2.5));
    $('l1lash').style.opacity = seg(t, 2.1, 2.3);
    $('l1lash').style.transform = `translateY(${(1 - lash) * -30}px)`;
    const up = eInOut(seg(t, 2.6, 3.4));
    $('logo1').style.transform = `translateY(${-up * 120}px) scale(${lerp(1, 0.8, up)})`;
    const zk = seg(t, 2.8, 6);
    const zs = ['z', 'zZ', 'zZz'][Math.min(2, Math.floor(zk * 4))] || '';
    $('zzz').textContent = t > 2.8 ? zs : '';
    $('zzz').style.transform = `translate(${zk * 40}px, ${-120 - zk * 60}px)`;
    $('zzz').style.opacity = Math.min(seg(t, 2.8, 3.1), 1 - seg(t, 5.4, 6));
    [...$('title1').children].forEach((c, i) => {
      const k = eOut(seg(t, 3.0 + i * 0.035, 3.5 + i * 0.035));
      c.style.opacity = k; c.style.transform = `translateY(${(1 - k) * 40}px)`;
    });
    $('title1').style.transform = `translateY(${-up * 120}px)`;
    appear($('tag1'), t, 3.9, 0.7, 20);
    $('tag1').style.transform += ` translateY(${-up * 120}px)`;
  }

  // 2 · Problem
  if (t > 5.5 && t < 13.5) {
    const l = t - 6;
    appear($('s2k'), l, 0.3); appear($('s2t'), l, 0.5, 0.8, 40);
    appear($('s2card'), l, 1.2, 0.8, 50);
    const other = 4.7, model = eOut(seg(l, 1.6, 2.6)) * 9.6;
    $('s2other').style.width = `${(other + model) / 16 * 100}%`;
    $('s2model').style.width = `${model / 16 * 100}%`;
    const high = l > 3.2;
    $('s2press').innerHTML = `<span class="dot" style="background:${high ? 'var(--amber)' : 'var(--blue)'};margin-right:12px"></span><span style="color:${high ? 'var(--amber)' : 'var(--blue)'}">${T.press[high ? 1 : 0]}</span>`;
    $('s2model2').innerHTML = `<span style="color:#fff">●</span> qwen3:8b ${model.toFixed(1)} GB`;
    $('s2gb').textContent = `${(other + model).toFixed(1)} GB / 16 GB`;
    const mins = Math.floor(lerp(1, 45, eInOut(seg(l, 2.5, 6.5))));
    $('s2idle').innerHTML = `<span class="mono amber">◷</span> ${T.idle(mins)}`;
    $('s2idle').style.opacity = seg(l, 2.4, 2.8);
  }

  // 3 · Solution
  if (t > 12.5 && t < 21.5) {
    const l = t - 13;
    appear($('s3t'), l, 0.3, 0.7, 30);
    const left = Math.max(0, Math.ceil(lerp(5, 0, seg(l, 1.2, 3.6))));
    const asleep = l > 3.6;
    $('s3timer').innerHTML = asleep ? `<span class="blue">☾ ${T.asleep}</span>` : `<span class="amber">${T.frees(left)}</span>`;
    $('s3open').style.opacity = asleep ? 0 : 1; $('s3closed').style.opacity = asleep ? 1 : 0;
    const drain = eInOut(seg(l, 3.6, 5.0));
    const other = 4.7, model = 9.6 * (1 - drain);
    $('s3other').style.width = `${(other + model) / 16 * 100}%`;
    $('s3model').style.width = `${model / 16 * 100}%`;
    $('s3model2').innerHTML = `<span style="color:#fff">●</span> ${(model).toFixed(1)} GB`;
    $('s3gb').textContent = `${(other + model).toFixed(1)} GB / 16 GB`;
    $('s3big').innerHTML = `<span class="blue">${T.back((9.6 * drain).toFixed(1))}</span>`;
    appear($('s3big'), l, 3.7, 0.5, 30);
    appear($('s3sub'), l, 5.0, 0.7, 20);
  }

  // 4 · Panel walkthrough
  if (t > 20.5 && t < 31.5) {
    const l = t - 21;
    appear($('s4k'), l, 0.3);
    const pin = eOut(seg(l, 0.2, 1.2));
    const panel = $('s4panel');
    panel.style.transform = `translateX(${(1 - pin) * 300}px) rotateY(${(1 - pin) * -18}deg)`;
    panel.style.opacity = pin;
    // Focus points in the 684x1450 screenshot: [y top, height, x, width]
    const F = [[150, 180, 40, 290], [355, 330, 40, 604], [495, 65, 448, 186], [700, 100, 40, 604], [840, 510, 30, 625]];
    const sc = 453 / 684;
    const per = 1.85, start = 1.2;
    const idx = clamp(Math.floor((l - start) / per), 0, F.length - 1);
    T.callouts.forEach((_, i) => {
      const el = $('co' + i);
      const a = start + i * per;
      const kin = eOut(seg(l, a, a + 0.5)), kout = seg(l, a + per - 0.25, a + per + 0.2);
      const last = i === F.length - 1;
      el.style.top = `${330}px`;
      el.style.opacity = last ? kin : kin * (1 - kout);
      el.style.transform = `translateY(${(1 - kin) * 40 - (last ? 0 : kout) * 40}px)`;
      el.style.filter = `blur(${((1 - kin) + (last ? 0 : kout)) * 6}px)`;
    });
    // Ring glides between focus points
    const f = l - start - idx * per;
    const prev = F[Math.max(0, idx - 1)], cur = F[idx];
    const g = idx === 0 ? 1 : eInOut(seg(f, 0, 0.45));
    const box = cur.map((v, j) => lerp(prev[j], v, g));
    const ring = $('s4ring');
    ring.style.left = `${1260 + box[2] * sc - 8}px`; ring.style.top = `${60 + box[0] * sc - 8}px`;
    ring.style.width = `${box[3] * sc + 16}px`; ring.style.height = `${box[1] * sc + 16}px`;
    ring.style.opacity = seg(l, start, start + 0.4);
  }

  // 5 · Feature grid
  if (t > 30.5 && t < 41.5) {
    const l = t - 31;
    appear($('s5t'), l, 0.2, 0.7);
    T.feats.forEach((_, i) => {
      const el = $('fc' + i);
      const a = 0.8 + i * 0.32;
      const k = eBack(seg(l, a, a + 0.55));
      el.style.opacity = seg(l, a, a + 0.3);
      el.style.transform = `translateY(${(1 - k) * 60}px) scale(${lerp(0.9, 1, k)})`;
      // Spotlight wave once all are in
      const w = Math.exp(-Math.pow((l - 6.2) * 3 - i * 0.45, 2));
      el.style.borderColor = `rgba(77,163,255,${0.09 + w * 0.7})`;
      el.style.boxShadow = `0 30px 80px rgba(0,0,0,0.55), 0 0 ${w * 40}px rgba(77,163,255,${w * 0.35})`;
    });
  }

  // 6 · Game mode
  if (t > 40.5 && t < 49) {
    const l = t - 41;
    appear($('s6k'), l, 0.3); appear($('s6t'), l, 0.5, 0.8); appear($('s6p'), l, 1.2, 0.7);
    appear($('s6ollama'), l, 0.6, 0.7, 40);
    const gIn = eBack(seg(l, 1.6, 2.2)), gOut = seg(l, 5.2, 5.6);
    const gm = $('s6game');
    gm.style.opacity = seg(l, 1.6, 1.9) * (1 - gOut * 0.6);
    gm.style.transform = `scale(${lerp(0.85, 1, gIn) * (1 - gOut * 0.08)})`;
    $('s6gname').textContent = l > 5.2 ? T.gameOff : T.game;
    const off = l > 3.0 && l < 6.2;
    const back = l >= 6.2;
    $('s6state').textContent = off ? T.off : T.on;
    $('s6state').style.color = off ? 'var(--dim)' : 'var(--ink)';
    $('s6sub').textContent = off ? T.offSub : back ? T.backSub : T.onSub;
    $('s6pw').style.stroke = off ? '#555' : '#4DA3FF'; $('s6pwi').style.stroke = off ? '#777' : '#4DA3FF';
    const v = 1.0 + 4.3 * (l < 3 ? 1 : l < 3.8 ? 1 - eInOut(seg(l, 3, 3.8)) : l < 6.2 ? 0 : eInOut(seg(l, 6.2, 7)));
    $('s6vbar').style.width = `${v / 8 * 100}%`;
    $('s6vgb').textContent = `${v.toFixed(1)} GB / 8 GB`;
    appear($('s6vram'), l, 0.9, 0.7, 30);
  }

  // 7 · Watchdog + toasts
  if (t > 48 && t < 55) {
    const l = t - 48.5;
    appear($('s7k'), l, 0.3); appear($('s7t'), l, 0.5, 0.8); appear($('s7p'), l, 1.2, 0.7);
    T.toasts.forEach((_, i) => {
      const el = $('to' + i);
      const a = 0.9 + i * 1.0;
      const k = eOut(seg(l, a, a + 0.5));
      const stackY = 760 - (T.toasts.length - 1 - i) * 0;
      // Each new toast pushes the older ones up
      let shift = 0;
      for (let j = i + 1; j < T.toasts.length; j++) shift += eOut(seg(l, 0.9 + j * 1.0, 1.4 + j * 1.0)) * 140;
      el.style.top = `${stackY - shift}px`;
      el.style.opacity = k * (1 - seg(shift, 280, 420));
      el.style.transform = `translateX(${(1 - k) * 620}px)`;
    });
  }

  // 8 · Pet gallery
  if (t > 54 && t < 61) {
    const l = t - 54.5;
    appear($('s8k'), l, 0.3); appear($('s8t'), l, 0.5, 0.8);
    T.pets.forEach(([id], i) => {
      const w = $('pw' + i);
      const a = 1.0 + i * 0.3;
      const k = eBack(seg(l, a, a + 0.6));
      w.style.opacity = seg(l, a, a + 0.25);
      w.style.transform = `translateY(${(1 - k) * 80}px)`;
      // Each pet does its own idle gesture, then a reaction
      const sp = $('pet' + i);
      const lt = l - a;
      const fr = Math.floor(lt * FPS_SPRITE);
      if (lt < 2.2) setSprite(sp, 'Alert', fr);
      else if (lt < 3.6) setSprite(sp, 'G' + ([0, 4, 1, 1][i]), Math.floor((lt - 2.2) * 8.5), false);
      else setSprite(sp, 'Hearts', Math.floor((lt - 3.6) * 9), false);
    });
  }

  // 9 · Taskbar states
  if (t > 60 && t < 69) {
    const l = t - 60.5;
    appear($('s9k'), l, 0.3); appear($('s9t'), l, 0.5, 0.8);
    const bar = $('s9bar');
    const bk = eOut(seg(l, 0.2, 0.9));
    bar.style.transform = `translateY(${(1 - bk) * 160}px)`;
    const STATE_ROWS = ['DeepSleep', 'Eating', 'Working', 'Downloading', 'Sweeping', 'Hearts'];
    const PETS = ['mira', 'llama', 'orange-cat', 'capybara', 'mira', 'orange-cat'];
    const per = 1.2, s0 = 1.0;
    const i = clamp(Math.floor((l - s0) / per), 0, STATE_ROWS.length - 1);
    const li = l - s0 - i * per;
    const pet = $('tbpet');
    if (pet._pet !== PETS[i]) { pet._pet = PETS[i]; pet._row = null;
      pet.style.width = META[PETS[i]].w * 1.5 + 'px'; pet.style.height = META[PETS[i]].h * 1.5 + 'px'; }
    const row = STATE_ROWS[i];
    setSprite(pet, row, Math.floor(Math.max(0, li) * FPS_SPRITE), row !== 'Hearts');
    const m = META[PETS[i]];
    pet.style.left = `${600 + 33 - m.w * 1.5 / 2}px`;
    pet.style.top = `${1080 - 144 - m.h * 1.5 + 36 + (1 - bk) * 160}px`;
    pet.style.opacity = seg(l, 0.7, 1.0) * (1 - seg(li, per - 0.12, per) * (i < STATE_ROWS.length - 1 ? 1 : 0)) ;
    const [st, act] = T.states[i];
    const kk = eOut(seg(li, 0, 0.35));
    $('s9state').innerHTML = `<div class="pill glass" style="font-size:34px;padding:16px 30px"><span class="dot" style="background:${i === 0 ? '#666' : i === 4 ? 'var(--green)' : 'var(--blue)'}"></span>${st}</div>
      <div style="font-size:64px;font-weight:700;letter-spacing:-1.5px;margin-top:30px">→ ${act}</div>`;
    $('s9state').style.opacity = l < s0 ? 0 : kk;
    $('s9state').style.transform = `translateY(${(1 - kk) * 24}px)`;
    // Windows logo lights: off when Ollama is off, glow otherwise, flicker while typing
    const on = i > 0;
    const flick = row === 'Working' ? 0.6 + 0.4 * Math.abs(Math.sin(l * 13)) : 1;
    $('wglow').style.opacity = on ? 0.9 * flick : 0;
    for (let p = 0; p < 4; p++) {
      const fill = row === 'Downloading' ? (seg(li, p * 0.22, p * 0.22 + 0.2) ? 1 : 0.35) : 1;
      $('wp' + p).style.filter = on ? `brightness(${1.1 + 0.25 * fill * flick}) drop-shadow(0 0 ${8 * fill}px rgba(120,210,255,0.9))` : '';
      $('wp' + p).style.opacity = row === 'Downloading' ? 0.55 + 0.45 * fill : 1;
    }
  }

  // 10 · Activity + settings
  if (t > 68 && t < 72.5) {
    const l = t - 68.5;
    appear($('s10k'), l, 0.2); appear($('s10t'), l, 0.4, 0.8); appear($('s10p'), l, 1.0, 0.7);
    const a = eOut(seg(l, 0.2, 1.0)), b = eOut(seg(l, 0.5, 1.3));
    $('s10a').style.opacity = a; $('s10a').style.transform = `translateY(${(1 - a) * 120}px)`;
    $('s10s').style.opacity = b; $('s10s').style.transform = `translateY(${(1 - b) * 120}px)`;
    const sh = 420 / 684 * 5318 - 940;
    $('s10simg').style.top = `${-eInOut(seg(l, 1.2, 3.7)) * sh * 0.55}px`;
  }

  // 11 · Outro
  if (t > 71.5) {
    const l = t - 72;
    const k = eBack(seg(l, 0.1, 0.8));
    $('s11logo').style.transform = `scale(${lerp(0.5, 1, k)}) rotate(${(1 - k) * -40}deg)`;
    $('s11logo').style.opacity = seg(l, 0.1, 0.4);
    appear($('s11pills'), l, 0.9, 0.7);
    appear($('s11url'), l, 1.4, 0.7);
    appear($('s11by'), l, 1.9, 0.7);
  }
}

window.ready = (async () => {
  META = await (await fetch('sprites/meta.json')).json();
  build();
  const imgs = [...document.images].concat(
    Object.keys(META).flatMap(p => ['Alert', 'G0', 'G1', 'G4', 'Hearts', 'DeepSleep', 'Eating', 'Working', 'Downloading', 'Sweeping']
      .filter(r => META[p].rows[r])
      .map(r => { const i = new Image(); i.src = `sprites/${p}-${r}.png`; return i; })));
  await Promise.all(imgs.map(i => i.decode()));
  await document.fonts.ready;
  render(0);
  return DURATION;
})();
window.render = render;
</script>
</body>
</html>
