<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<link rel="icon" href="/Assets/istargetsleeping-icon.svg" type="image/svg+xml">
<title>isTargetSleeping · Recorrido del notch</title>
<style>
  :root { color-scheme: dark; --bg:#050506; --ink:#f5f5f7; --muted:#aaaab1; --line:#29292d; --blue:#c7d8ff; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--ink); font-family:"Segoe UI Variable Display","Segoe UI",Arial,sans-serif; }
  body { position:relative; }
  body::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.18; background:radial-gradient(circle,rgba(255,255,255,.15) 1px,transparent 1.5px) 0 0/38px 38px; mask-image:radial-gradient(ellipse at 50% 45%,#000 15%,transparent 78%); }
  .brand { position:absolute; z-index:5; top:42px; left:84px; display:flex; align-items:center; gap:14px; color:#ededf0; font-size:22px; font-weight:650; letter-spacing:-.3px; }
  .brand img { width:42px; height:42px; }
  .brand span { opacity:.88; }
  .headline { position:absolute; z-index:4; left:0; right:0; top:96px; text-align:center; padding:0 150px; transition:opacity .5s ease, transform .5s ease; }
  .eyebrow { color:var(--muted); font-size:22px; font-weight:600; letter-spacing:.15px; }
  h1 { margin-top:12px; font-size:60px; line-height:1.06; letter-spacing:-2px; font-weight:720; }
  .subtitle { margin:14px auto 0; max-width:900px; color:var(--muted); font-size:25px; line-height:1.36; }
  .headline.changing { opacity:0; transform:translateY(10px); }
  .stage { position:absolute; inset:0; }
  #simulator-view { position:absolute; z-index:2; left:0; right:0; top:260px; height:590px; opacity:1; transition:opacity .65s ease; }
  #simulator { width:1920px; height:590px; border:0; display:block; }
  .capture { position:absolute; z-index:2; left:0; right:0; top:226px; height:820px; display:flex; align-items:center; justify-content:center; opacity:0; transform:translateY(18px) scale(.985); transition:opacity .6s ease, transform .6s ease; pointer-events:none; }
  .capture img { display:block; border:1px solid rgba(255,255,255,.16); border-radius:18px; box-shadow:0 38px 100px rgba(0,0,0,.7); background:#08080a; }
  #settings-frame { width:980px; max-width:calc(100vw - 300px); border-radius:24px; overflow:hidden; }
  #settings-frame img { width:100%; height:auto; }
  .capture-note { position:absolute; left:0; right:0; bottom:7px; color:#bdbdc4; text-align:center; font-size:20px; letter-spacing:.2px; }
  body[data-mode="settings"] #simulator-view { opacity:0; }
  body[data-mode="settings"] #settings-capture { opacity:1; transform:none; }
  .foot { position:absolute; z-index:4; left:0; right:0; bottom:46px; display:flex; align-items:center; justify-content:center; gap:12px; color:#85858d; font:600 15px "Segoe UI",Arial,sans-serif; letter-spacing:1.15px; text-transform:uppercase; }
  .foot::before,.foot::after { content:""; width:54px; height:1px; background:#3a3a40; }
  .foot .dot { width:4px; height:4px; border-radius:50%; background:#b8b8c0; }
  .count { position:absolute; z-index:4; top:48px; right:88px; color:#777780; font:600 14px "Cascadia Mono",Consolas,monospace; letter-spacing:1.5px; }
</style>
</head>
<body>
<div class="brand"><img src="/Assets/istargetsleeping-icon-256.png" alt=""><span>isTargetSleeping</span></div>
<div class="count" id="count">01 / 08</div>
<header class="headline" id="headline">
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="title"></h1>
  <p class="subtitle" id="subtitle"></p>
</header>
<main class="stage">
  <div id="simulator-view"><iframe id="simulator" title="Simulador animado del notch"></iframe></div>
  <section class="capture" id="settings-capture">
    <div id="settings-frame"><img id="settings" alt="Ajustes generales de la app de escritorio"></div>
  </section>
</main>
<footer class="foot" id="foot"><span>Windows</span><i class="dot"></i><span id="foot-copy"></span></footer>
<script>
const lang = new URLSearchParams(location.search).get('lang') === 'es' ? 'es' : 'en';
document.documentElement.lang = lang;
const text = {
  en: {
    eyebrow: 'A small window into your day', foot: 'Free and open source',
    scenes: [
      [0, 7, 'Meet your desktop notch.', 'Explore animated notch states modeled on the app: music, activity and quick controls.', 'pet', 'sim'],
      [7, 14, 'A notch with room to rest.', 'Its mascot sleeps and wakes inside the notch while your desktop stays clear.', 'pet', 'sim'],
      [14, 20, 'The compact notch, always close.', 'Time, battery and music fit into the notch’s compact pill.', 'idle', 'sim'],
      [20, 32, 'Music in your notch.', 'See the cover, progress and playback controls in the animated notch.', 'music', 'sim'],
      [32, 43, 'Lyrics in your notch.', 'Follow the current line beside playback controls as the notch changes with the song.', 'lyrics', 'sim'],
      [43, 53, 'System stats in the notch.', 'CPU, memory, graphics and disk in one compact notch view.', 'system', 'sim'],
      [53, 68, 'Settings for your notch and agents.', 'Set agent permissions, sounds, response time and alerts in the desktop app.', 'music', 'settings'],
      [68, 77, 'Your day, in the notch.', 'Music, system stats, lyrics and more, always close at hand.', 'music', 'sim'],
    ],
    settings: 'Desktop app · Settings · General',
  },
  es: {
    eyebrow: 'Una ventana pequeña a tu día', foot: 'Gratis y de código abierto',
    scenes: [
      [0, 7, 'Conoce el notch de tu escritorio.', 'Explora estados animados inspirados en la app: música, actividad y controles rápidos.', 'pet', 'sim'],
      [7, 14, 'Un notch con espacio para descansar.', 'Su mascota duerme y despierta dentro del notch mientras tu escritorio sigue despejado.', 'pet', 'sim'],
      [14, 20, 'El notch compacto, siempre a mano.', 'La hora, la batería y la música caben en la pastilla compacta del notch.', 'idle', 'sim'],
      [20, 32, 'Música en tu notch.', 'La portada, el progreso y los controles de reproducción en el notch animado.', 'music', 'sim'],
      [32, 43, 'Letras dentro del notch.', 'Sigue la línea actual junto a los controles mientras el notch cambia con la canción.', 'lyrics', 'sim'],
      [43, 53, 'El sistema, dentro del notch.', 'CPU, memoria, gráficos y disco en una vista compacta del notch.', 'system', 'sim'],
      [53, 68, 'Ajustes para el notch y sus agentes.', 'Ajusta permisos, sonidos, tiempo de respuesta y avisos desde la app de escritorio.', 'music', 'settings'],
      [68, 77, 'Tu día, en el notch.', 'Música, sistema, letras y más, siempre a mano.', 'music', 'sim'],
    ],
    settings: 'App de escritorio · Ajustes · General',
  },
}[lang];
const iframe = document.getElementById('simulator');
iframe.src = `/site/index.html?lang=${lang}`;
document.getElementById('settings').src = `/docs/images/settings-${lang}.png`;
document.getElementById('eyebrow').textContent = text.eyebrow;
document.getElementById('foot-copy').textContent = text.foot;
let simulatorFrame = null;
window.tourReady = false;
iframe.addEventListener('load', () => {
  simulatorFrame = iframe.contentWindow;
  const style = iframe.contentDocument.createElement('style');
  style.textContent = `
    html,body{width:1920px!important;height:590px!important;min-height:0!important;overflow:hidden!important;background:#000!important}
    body>*:not(main):not(script){display:none!important}
    main{display:block!important;width:1920px!important;height:590px!important;min-height:0!important;overflow:hidden!important}
    main>*:not(#probar){display:none!important}
    #probar{display:block!important;position:relative!important;width:1920px!important;height:590px!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important;background:#000!important}
    #probar>.contenedor:first-child{display:none!important}
    #probar .sim-pin{position:relative!important;top:auto!important;left:auto!important;width:100%!important;height:540px!important;min-height:0!important;padding:0!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:0!important}
    #probar .laptop{position:relative!important;top:auto!important;left:auto!important;flex:none!important;width:100%!important;height:320px!important;max-width:none!important;margin:0!important;transform:none!important;opacity:1!important;mask:none!important;-webkit-mask:none!important}
    #probar .try{margin:0!important;gap:10px!important;justify-content:center!important}
    #probar .try button{font-size:16px!important;padding:10px 22px!important}
    #probar .try button[data-s="ollama"]{display:none!important}
    #probar .cap{margin-top:10px!important;font-size:14px!important;line-height:1.35!important}
    #probar .revela,#probar .revela.vista,#probar .revela.visible{opacity:1!important;transform:none!important}
    #probar .wall video{display:block!important;opacity:1!important}
  `;
  iframe.contentDocument.head.append(style);
  iframe.contentWindow.scrollTo(0, 0);
  iframe.contentDocument.querySelector('#probar .try button[data-s="pet"]')?.click();
  document.fonts.ready.then(() => { window.tourReady = true; });
});
const scenes = text.scenes;
let active = -1, activeState = '';
function render(time) {
  const index = Math.max(0, scenes.findIndex((scene, i) => time >= scene[0] && (time < scene[1] || i === scenes.length - 1)));
  const scene = scenes[index];
  if (!scene) throw new Error(`No tour scene at ${time}s`);
  if (index !== active) {
    const head = document.getElementById('headline');
    head.classList.add('changing');
    setTimeout(() => {
      document.getElementById('title').textContent = scene[2];
      document.getElementById('subtitle').textContent = scene[3];
      document.body.dataset.mode = scene[5];
      document.getElementById('count').textContent = `${String(index + 1).padStart(2,'0')} / 08`;
      document.getElementById('settings').alt = scene[5] === 'settings' ? text.settings : '';
      head.classList.remove('changing');
    }, 140);
    if (scene[5] === 'sim' && simulatorFrame && activeState !== scene[4]) {
      iframe.contentDocument.querySelector(`#probar .try button[data-s="${scene[4]}"]`)?.click();
      if (scene[4] === 'pet') setTimeout(() => iframe.contentDocument.querySelector('#mn')?.click(), 700);
      activeState = scene[4];
    }
    active = index;
  }
  return scene[5];
}
window.ready = 77;
window.render = render;
</script>
</body>
</html>
