<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Tu juego se queda la RAM y la VRAM; Ollama vuelve solo</title>
  <desc id="d">Abres un juego → +5 s → Sales → +30 s</desc>
  <style>

@media (prefers-reduced-motion: reduce){image{animation:none!important}}
</style>
